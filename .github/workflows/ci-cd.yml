name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  APP_NAME: event-app-v2
  
permissions:
  contents: write

jobs:
  # Job 1: Lint и TypeScript проверка (быстро)
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: event-app_v2/package-lock.json

      - name: Restore `node_modules` cache
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: event-app_v2/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('event-app_v2/package-lock.json') }}-${{ env.NODE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies (only if cache miss)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ./event-app_v2
        run: npm ci --prefer-offline --no-audit

      - name: Run TypeScript check
        working-directory: ./event-app_v2
        run: npm run type-check

      - name: Run linter
        working-directory: ./event-app_v2
        run: npm run lint

  # Job 2: Сборка приложения (после lint)
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    # Run on all triggers (PRs and Pushes to protected branches)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: event-app_v2/package-lock.json

      - name: Restore `node_modules` cache
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: event-app_v2/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('event-app_v2/package-lock.json') }}-${{ env.NODE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies (only if cache miss)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ./event-app_v2
        run: npm ci --prefer-offline --no-audit

      - name: Build application
        working-directory: ./event-app_v2
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Create deployment archive
        run: |
          cd event-app_v2/dist
          tar -czf ../../deployment.tar.gz .
          cd ../..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deployment.tar.gz
          retention-days: 7

  # Job 3: Автоинкремент версии (после build)
  version:
    name: Auto Version Increment
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    timeout-minutes: 5
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      new_tag: ${{ steps.version.outputs.new_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Orange-hanter/WebTuser.git
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get current version
        id: current_version
        working-directory: ./event-app_v2
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Determine version bump
        id: bump_type
        run: |
          # Get latest commit message
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '[:upper:]' '[:lower:]')

          # Determine bump type based on conventional commits
          if echo "$COMMIT_MSG" | grep -q "breaking change"; then
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -q "^feat:"; then
            BUMP_TYPE="minor"
          elif echo "$COMMIT_MSG" | grep -q "^fix:"; then
            BUMP_TYPE="patch"
          else
            BUMP_TYPE="patch"  # Default to patch for other commits
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Commit: $COMMIT_MSG"
          echo "Bump type: $BUMP_TYPE"

      - name: Calculate new version
        id: version
        working-directory: ./event-app_v2
        run: |
          BUMP_TYPE="${{ steps.bump_type.outputs.bump_type }}"
          echo "Bump type: $BUMP_TYPE"

          # Use npm to bump the version in package.json / package-lock.json without creating a git tag
          npm --no-git-tag-version version "$BUMP_TYPE"

          NEW_VERSION=$(node -p "require('./package.json').version")
          NEW_TAG="v$NEW_VERSION"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
          echo "New tag: $NEW_TAG"

      - name: Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add event-app_v2/package.json event-app_v2/package-lock.json || true
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}" || echo "No changes to commit"
          # Push the commit back to the branch (uses token from checkout)
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed or not required"

      - name: Create git tag (for feat/minor and breaking/major)
        if: steps.bump_type.outputs.bump_type == 'minor' || steps.bump_type.outputs.bump_type == 'major'
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Created and pushed tag: $NEW_TAG"

      - name: Create release (only for breaking changes / major)
        if: steps.bump_type.outputs.bump_type == 'major'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          release_name: Release ${{ steps.version.outputs.new_tag }}
          body: |
            🚀 **Version ${{ steps.version.outputs.new_version }}**

            **Changes:**
            - Auto-incremented version (breaking change)
            - Build: ${{ github.run_id }}
            - Branch: ${{ github.ref_name }}

            **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false

  # Job 4: E2E тесты (после build)
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    if: false # disable for now
    # Run on all triggers (PRs and Pushes to protected branches)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: event-app_v2/package-lock.json

      - name: Restore `node_modules` cache
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: event-app_v2/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('event-app_v2/package-lock.json') }}-${{ env.NODE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies (only if cache miss)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ./event-app_v2
        run: npm ci --prefer-offline --no-audit

      - name: Get Playwright version
        id: playwright-version
        working-directory: ./event-app_v2
        run: |
          PLAYWRIGHT_VERSION=$(npm list @playwright/test --depth=0 --json | jq -r '.dependencies["@playwright/test"].version')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./event-app_v2
        run: npx playwright install --with-deps chromium firefox

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./event-app_v2
        run: npx playwright install-deps chromium firefox

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Extract and serve production build
        working-directory: ./event-app_v2
        run: |
          mkdir -p dist
          tar -xzf ../deployment.tar.gz -C dist
          npx serve -s dist -l 5173 &
          sleep 5

      - name: Run E2E tests
        working-directory: ./event-app_v2
        run: npm run test:e2e || echo "Tests completed"
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: event-app_v2/playwright-report/
          retention-days: 30

  # Job 5: Деплой на staging (develop branch)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [version]  # depends on version increment and tests TODO: add test when tests enabled
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    timeout-minutes: 15
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Deploy to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deployment.tar.gz"
          target: "/tmp/"
          timeout: 60s
          command_timeout: 10m

      - name: Execute deployment script on staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Создаем директорию для приложения
            mkdir -p /var/www/${{ env.APP_NAME }}/staging
            
            # Бэкап предыдущей версии - TEMPORARILY DISABLED
            # if [ -d "/var/www/${{ env.APP_NAME }}/staging/current" ]; then
            #   mv /var/www/${{ env.APP_NAME }}/staging/current /var/www/${{ env.APP_NAME }}/staging/backup_$(date +%Y%m%d_%H%M%S)
            # fi
            
            # Удаляем старую версию без бэкапа
            rm -rf /var/www/${{ env.APP_NAME }}/staging/current
            
            # Создаем новую директорию
            mkdir -p /var/www/${{ env.APP_NAME }}/staging/current
            
            # Распаковываем новую версию
            tar -xzf /tmp/deployment.tar.gz -C /var/www/${{ env.APP_NAME }}/staging/current
            
            # Удаляем архив
            rm /tmp/deployment.tar.gz
            
            # Перезапускаем nginx (или ваш веб-сервер)
            sudo systemctl reload nginx || echo "Nginx reload skipped"
            
            # Очищаем старые бэкапы (оставляем последние 3)
            cd /var/www/${{ env.APP_NAME }}/staging
            ls -t | grep backup | tail -n +4 | xargs -r rm -rf
            
            echo "Deployment to staging completed successfully!"

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 10
          curl -f ${{ secrets.STAGING_URL }} || echo "Health check failed"

  # Job 6: Деплой на production (main branch)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [version, test]  # depends on version increment and tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Deploy to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deployment.tar.gz"
          target: "/tmp/"
          timeout: 60s
          command_timeout: 10m

      - name: Execute deployment script on production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Создаем директорию для приложения
            mkdir -p /var/www/${{ env.APP_NAME }}/production
            
            # Бэкап предыдущей версии - TEMPORARILY DISABLED
            # if [ -d "/var/www/${{ env.APP_NAME }}/production/current" ]; then
            #   mv /var/www/${{ env.APP_NAME }}/production/current /var/www/${{ env.APP_NAME }}/production/backup_$(date +%Y%m%d_%H%M%S)
            # fi
            
            # Удаляем старую версию без бэкапа
            rm -rf /var/www/${{ env.APP_NAME }}/production/current
            
            # Создаем новую директорию
            mkdir -p /var/www/${{ env.APP_NAME }}/production/current
            
            # Распаковываем новую версию
            tar -xzf /tmp/deployment.tar.gz -C /var/www/${{ env.APP_NAME }}/production/current
            
            # Удаляем архив
            rm /tmp/deployment.tar.gz
            
            # Перезапускаем nginx
            sudo systemctl reload nginx
            
            # Очищаем старые бэкапы (оставляем последние 5)
            cd /var/www/${{ env.APP_NAME }}/production
            ls -t | grep backup | tail -n +6 | xargs -r rm -rf
            
            echo "Deployment to production completed successfully!"

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 10
          curl -f ${{ secrets.PRODUCTION_URL }} || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Production deployment successful!"
          echo "URL: ${{ secrets.PRODUCTION_URL }}"

  # Job 7: Откат деплоя при неудаче - TEMPORARILY DISABLED (no backups)
  rollback:
    name: Rollback (Disabled - No Backups)
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: false  # Disabled because backups are disabled
    
    steps:
      - name: Rollback production deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/${{ env.APP_NAME }}/production
            
            # Находим последний бэкап
            LATEST_BACKUP=$(ls -t | grep backup | head -n 1)
            
            if [ -n "$LATEST_BACKUP" ]; then
              echo "Rolling back to $LATEST_BACKUP"
              rm -rf current
              mv $LATEST_BACKUP current
              sudo systemctl reload nginx
              echo "Rollback completed successfully!"
            else
              echo "No backup found for rollback!"
              exit 1
            fi
