<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон: портал/око -->
  <circle cx="16" cy="16" r="14" fill="#2D3142"/>

  <!-- Анимированная волна (пульс) -->
  <path d="M8 20 Q12 14, 16 18 Q20 22, 24 16"
        stroke="#E07A5F"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
        opacity="0.9">
    <animate
      attributeName="d"
      dur="3s"
      repeatCount="indefinite"
      values="
        M8 20 Q12 14, 16 18 Q20 22, 24 16;
        M8 20 Q12 12, 16 20 Q20 24, 24 14;
        M8 20 Q12 14, 16 18 Q20 22, 24 16
      "
      keyTimes="0; 0.5; 1"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
    />
  </path>

  <!-- Искра (пульсирует в ритме) -->
  <circle cx="16" cy="18" r="2" fill="#FFD166">
    <animate
      attributeName="r"
      dur="3s"
      repeatCount="indefinite"
      values="2; 2.8; 2"
      keyTimes="0; 0.5; 1"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
    />
    <animate
      attributeName="opacity"
      dur="3s"
      repeatCount="indefinite"
      values="1; 0.7; 1"
      keyTimes="0; 0.5; 1"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
    />
  </circle>
</svg>